<style>
/* 左に絞り込みと一覧、右に地図。スマホでは地図の下に一覧 */
:root {

  --c-ichi: #c0392b; --c-sobyo: #7b4fa0; --c-inari: #d9822b; --c-shisho: #2f7d6d;
  --done: #2a2522;

  --body: "Zen Kaku Gothic New", "Hiragino Sans", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #1b1917; --panel: #24211e; --fg: #ede6dd; --muted: #a59a8f; --line: #3a3530;
    --c-ichi: #e36b5c; --c-sobyo: #b08ad3; --c-inari: #efa257; --c-shisho: #5fb7a4; --done: #ede6dd; color-scheme: dark; }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font: 14px/1.6 var(--body); display: grid; grid-template-columns: 360px 1fr; height: 100dvh; }
aside { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--line); background: var(--panel); }
header { padding: 16px 18px 12px; border-bottom: 1px solid var(--line); display: grid; gap: 10px; }
h1 { margin: 0; font: 700 21px/1.3 var(--display); letter-spacing: .04em; }
.sub { margin: 0; color: var(--muted); font-size: 12px; }

.cats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.cat { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; user-select: none; white-space: nowrap; }
.cat input { margin: 0; accent-color: var(--fg); }
.dot { width: 11px; height: 11px; border-radius: 50%; flex: none; border: 2px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.25); }

.row { display: flex; gap: 6px; }
#q { flex: 1; min-width: 0; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: inherit; font-size: 16px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: none; color: var(--muted); font: inherit; font-size: 13px; padding: 6px 4px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--panel); }
#list { list-style: none; margin: 0; padding: 0 0 env(safe-area-inset-bottom, 0px); overflow-y: auto; flex: 1; -webkit-overflow-scrolling: touch; }
#list li { padding: 8px 12px 8px 6px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 44px 1fr; align-items: center; }
#list .chk { width: 44px; height: 44px; border: 0; background: none; display: grid; place-items: center; cursor: pointer; padding: 0; }
#list .box { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--c); display: grid; place-items: center; color: #fff; font-size: 13px; font-weight: 700; }
#list li.done .box { background: var(--c); }
#list .info { cursor: pointer; min-width: 0; }
#list .nm { font-weight: 700; }
#list li.done .nm::after { content: attr(data-date); margin-left: 8px; color: var(--muted); font-weight: 400; font-size: 11px; font-variant-numeric: tabular-nums; }
#list .meta { color: var(--muted); font-size: 12px; }
#list .empty { display: block; padding: 24px 18px; color: var(--muted); cursor: default; }
footer { display: flex; gap: 8px; padding: 8px 18px calc(8px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); }
footer button, .pop button { font: inherit; font-size: 12px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); cursor: pointer; }
#map { height: 100%; min-height: 0; }
.pin { width: 18px; height: 18px; border-radius: 50%; border: 2px solid #fff; box-shadow: 0 1px 3px rgba(0,0,0,.4); display: grid; place-items: center; color: #fff; font: 700 11px/1 sans-serif; }
.pin.big { width: 22px; height: 22px; }
.pin.done { border-color: var(--done); box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(0,0,0,.5); }
.pin.me { background: #1a73e8; width: 16px; height: 16px; box-shadow: 0 0 0 6px rgba(26,115,232,.25); }
.leaflet-popup-content { font: 13px/1.6 var(--body); }
.pop h3 { margin: 0 0 4px; font: 700 16px/1.3 var(--display); }
.pop .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; }
.pop .tag { color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 10px; }
.pop .approx { color: #b34; font-size: 12px; }
.pop .links { margin-top: 6px; display: flex; gap: 12px; }
.pop .visit { margin-top: 8px; width: 100%; padding: 8px; font-size: 14px; font-weight: 700; }
.pop .visit.on { background: #2a2522; color: #fff; border-color: #2a2522; }
.locate { width: 34px; height: 34px; background: #fff; border: 0; cursor: pointer; font-size: 18px; display: grid; place-items: center; color: #333; }
#toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--panel); padding: 8px 14px; border-radius: 20px; font-size: 13px; z-index: 1000; }
@media (max-width: 760px) {
  body { grid-template-columns: 1fr; grid-template-rows: 48dvh 1fr; }
  aside { order: 2; border-right: 0; border-top: 1px solid var(--line); }
  header { padding: 12px 14px 10px; }
  h1 { font-size: 18px; }
  #map { order: 1; }
}
</style>

const STORE_KEY = 'shrine-map-visits-v1';
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const CATS = [
  { key: '一宮', color: css('--c-ichi') },
  { key: '四所宗廟', color: css('--c-sobyo') },
  { key: '日本三大稲荷', color: css('--c-inari') },
  { key: '四所神社', color: css('--c-shisho') },
];
const colorOf = k => CATS.find(c => c.key === k).color;
const on = new Set(CATS.map(c => c.key));
let mode = 'all';

// 参拝記録 { 社のid: 'YYYY-MM-DD' }
function loadVisits() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; }
}
function saveVisits() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(visits)); } catch {}
}
let visits = loadVisits();
const today = () => {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
};

function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast.timer);
  toast.timer = setTimeout(() => { t.hidden = true; }, 2000);
}

const map = L.map('map').setView([36.2, 137.5], 5);
L.tileLayer('https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png', {
  maxZoom: 18, attribution: '<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank">地理院タイル</a>'
}).addTo(map);

function icon(p) {
  const done = !!visits[p.id];
  return L.divIcon({
    className: '', iconSize: null,
    html: `<div class="pin${p.cats.length > 1 ? ' big' : ''}${done ? ' done' : ''}" style="background:${colorOf(p.cats[0])}">${done ? '✓' : ''}</div>`,
  });
}

DATA.forEach(p => {
  p.marker = L.marker([p.lat, p.lng], { icon: icon(p) }).bindPopup(() => popup(p), { maxWidth: 280 });
});

function popup(p) {
  const tags = p.cats.map(c => `<span class="tag" style="background:${colorOf(c)}">${c}</span>`).join('');
  const notes = p.cats.map(c => p.notes[c]).filter(Boolean).map(n => `<div>${n}</div>`).join('');
  const gm = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(p.name.replace(/（.*?）/, '') + ' ' + p.loc)}`;
  const wk = `https://ja.wikipedia.org/wiki/${encodeURIComponent(p.wiki)}`;
  const done = visits[p.id];
  const el = document.createElement('div');
  el.className = 'pop';
  el.innerHTML = `<h3>${p.name}</h3><div class="tags">${tags}</div>${notes}<div>${p.loc}</div>` +
    (p.approx ? '<div class="approx">※ 正確な位置が不明のため、市町村・地区の中心付近に置いています</div>' : '') +
    `<div class="links"><a href="${gm}" target="_blank">Googleマップ</a><a href="${wk}" target="_blank">Wikipedia</a></div>` +
    `<button type="button" class="visit${done ? ' on' : ''}">${done ? `✓ 参拝済み（${done.replaceAll('-', '/')}）` : '参拝した'}</button>`;
  el.querySelector('.visit').addEventListener('click', () => { toggle(p); p.marker.setPopupContent(popup(p)); });
  return el;
}

function toggle(p) {
  if (visits[p.id]) {
    delete visits[p.id];
    toast(`${p.name} の記録を外しました`);
  } else {
    visits[p.id] = today();
    toast(`${p.name} を参拝済みにしました`);
  }
  saveVisits();
  p.marker.setIcon(icon(p));
  render();
}

// 現在地ボタン
let me = null;
const Locate = L.Control.extend({
  options: { position: 'topleft' },
  onAdd() {
    const b = L.DomUtil.create('button', 'leaflet-bar locate');
    b.type = 'button'; b.title = '現在地'; b.innerHTML = '◎';
    L.DomEvent.on(b, 'click', e => { L.DomEvent.stop(e); map.locate({ setView: true, maxZoom: 12 }); });
    return b;
  },
});
map.addControl(new Locate());
map.on('locationfound', e => {
  if (me) me.setLatLng(e.latlng);
  else me = L.marker(e.latlng, { icon: L.divIcon({ className: '', iconSize: null, html: '<div class="pin me"></div>' }), interactive: false }).addTo(map);
});
map.on('locationerror', () => toast('現在地を取得できませんでした。位置情報の許可を確認してください'));

const catsEl = document.getElementById('cats');
CATS.forEach(c => {
  const lab = document.createElement('label');
  lab.className = 'cat';
  lab.innerHTML = `<input type="checkbox" id="cat-${c.key}" checked><span class="dot" style="background:${c.color}"></span>${c.key}<span class="n" data-cat="${c.key}"></span>`;
  lab.querySelector('input').addEventListener('change', e => { e.target.checked ? on.add(c.key) : on.delete(c.key); render(); });
  catsEl.appendChild(lab);
});
document.getElementById('total').textContent = DATA.length;
document.getElementById('q').addEventListener('input', render);
document.querySelectorAll('#seg button').forEach(b => b.addEventListener('click', () => {
  mode = b.dataset.v;
  document.querySelectorAll('#seg button').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
}));

function render() {
  const q = document.getElementById('q').value.trim();
  const list = document.getElementById('list');
  list.innerHTML = '';
  let shown = 0;
  DATA.forEach(p => {
    const done = !!visits[p.id];
    const visible = p.cats.some(c => on.has(c)) &&
      (mode === 'all' || (mode === 'done') === done) &&
      (!q || [p.name, p.loc, ...Object.values(p.notes)].join(' ').includes(q));
    if (!visible) { p.marker.remove(); return; }
    shown++;
    p.marker.addTo(map);
    const li = document.createElement('li');
    if (done) li.className = 'done';
    li.style.setProperty('--c', colorOf(p.cats[0]));
    li.innerHTML = `<button type="button" class="chk" aria-label="${p.name}を参拝済みにする" aria-pressed="${done}"><span class="box">${done ? '✓' : ''}</span></button>` +
      `<div class="info" tabindex="0"><div class="nm" data-date="${done ? visits[p.id].replaceAll('-', '/') : ''}">${p.name}</div>` +
      `<div class="meta">${p.notes['一宮'] || p.cats.join('・')}　${p.loc}</div></div>`;
    li.querySelector('.chk').addEventListener('click', () => toggle(p));
    const go = () => { map.flyTo([p.lat, p.lng], 13, { duration: .8 }); p.marker.openPopup(); };
    li.querySelector('.info').addEventListener('click', go);
    li.querySelector('.info').addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
    list.appendChild(li);
  });
  if (!shown) list.innerHTML = '<li class="empty">条件に合う神社はありません</li>';
  document.getElementById('doneCount').textContent = DATA.filter(p => visits[p.id]).length;
  document.querySelectorAll('.cat .n').forEach(n => {
    const all = DATA.filter(p => p.cats.includes(n.dataset.cat));
    n.textContent = `${all.filter(p => visits[p.id]).length}/${all.length}`;
  });
}

// 記録のバックアップ（機種変更や Safari のデータ削除に備える）
document.getElementById('exportBtn').addEventListener('click', async () => {
  const text = JSON.stringify(visits);
  try { await navigator.clipboard.writeText(text); toast('記録をコピーしました。メモ帳などに貼って保存してください'); }
  catch { window.prompt('この文字列をコピーして保存してください', text); }
});
document.getElementById('importBtn').addEventListener('click', () => {
  const text = window.prompt('保存しておいた記録を貼り付けてください');
  if (!text) return;
  try {
    const data = JSON.parse(text);
    const ids = new Set(DATA.map(p => p.id));
    let n = 0;
    for (const [id, date] of Object.entries(data)) {
      if (ids.has(id) && /^\d{4}-\d{2}-\d{2}$/.test(date)) { visits[id] = date; n++; }
    }
    saveVisits();
    DATA.forEach(p => p.marker.setIcon(icon(p)));
    render();
    toast(`${n} 件の記録を読み込みました`);
  } catch { toast('読み込めませんでした。コピーした文字列をそのまま貼り付けてください'); }
});

render();
map.fitBounds(DATA.map(p => [p.lat, p.lng]), { padding: [20, 20] });

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js');
}
</script>
</body>
</html>
